<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Скоро — ЗАДЕТ</title>
    <link href="https://fonts.googleapis.com/css2?family=UnifrakturMaguntia&family=Cormorant+Garamond:wght@400;600;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root { --black: #0a0a0a; --white: #f5f5f5; --gray: #1a1a1a; }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--black);
            color: var(--white);
            line-height: 1.6;
            overflow-x: hidden;
            min-height: 100vh;
        }
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 9999;
            opacity: 0.06;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
        }

        header {
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 100;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(10,10,10,0.9);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid #222;
        }
        .logo { display: flex; align-items: center; text-decoration: none; transition: opacity 0.3s; }
        .logo img { height: 45px; width: auto; }
        .logo:hover { opacity: 0.8; }
        nav ul { display: flex; gap: 35px; list-style: none; }
        nav a {
            color: var(--white);
            text-decoration: none;
            font-size: 13px;
            letter-spacing: 3px;
            text-transform: uppercase;
            opacity: 0.7;
            transition: opacity 0.3s;
        }
        nav a:hover, nav a.active { opacity: 1; }
        .burger {
            display: none;
            flex-direction: column;
            gap: 5px;
            cursor: pointer;
            background: none;
            border: none;
            padding: 5px;
        }
        .burger span { width: 28px; height: 2px; background: var(--white); }

        .soon-page {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 140px 40px 80px;
            text-align: center;
        }
        .soon-tag {
            font-size: 12px;
            letter-spacing: 6px;
            text-transform: uppercase;
            opacity: 0.5;
            margin-bottom: 30px;
            animation: fadeUp 1s ease;
        }
        .soon-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: clamp(70px, 14vw, 180px);
            letter-spacing: 14px;
            text-transform: uppercase;
            line-height: 1;
            margin-bottom: 30px;
            position: relative;
            animation: fadeUp 1s ease 0.1s backwards;
        }
        .soon-title::before, .soon-title::after {
            content: 'СКОРО';
            position: absolute;
            top: 0; left: 0; right: 0;
            font-family: inherit;
            font-size: inherit;
            letter-spacing: inherit;
            opacity: 0.12;
        }
        .soon-title::before { color: #ff0033; transform: translate(-3px, 0); }
        .soon-title::after  { color: #00eaff; transform: translate(3px, 0); }

        .soon-sub {
            font-size: 14px;
            letter-spacing: 5px;
            text-transform: uppercase;
            opacity: 0.7;
            max-width: 520px;
            margin: 0 auto 50px;
            line-height: 2;
            animation: fadeUp 1s ease 0.2s backwards;
        }

        .divider {
            width: 1px;
            height: 60px;
            background: linear-gradient(to bottom, transparent, var(--white), transparent);
            margin: 0 auto 50px;
            animation: fadeUp 1s ease 0.3s backwards;
        }

        .subscribe-block {
            max-width: 560px;
            width: 100%;
            animation: fadeUp 1s ease 0.4s backwards;
        }
        .subscribe-block h2 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 22px;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 15px;
        }
        .subscribe-block > p {
            font-size: 13px;
            letter-spacing: 2px;
            opacity: 0.5;
            margin-bottom: 35px;
        }

        .telegram-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            padding: 18px;
            background: var(--white);
            color: var(--black);
            border: none;
            text-decoration: none;
            font-family: 'Inter', sans-serif;
            font-size: 12px;
            letter-spacing: 4px;
            text-transform: uppercase;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            margin-bottom: 25px;
        }
        .telegram-btn:hover { background: #ddd; letter-spacing: 6px; }
        .telegram-btn svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        .or-divider {
            display: flex;
            align-items: center;
            gap: 15px;
            margin: 30px 0;
            opacity: 0.4;
            font-size: 11px;
            letter-spacing: 4px;
            text-transform: uppercase;
        }
        .or-divider::before, .or-divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #333;
        }

        .subscribe-form {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .subscribe-form input {
            width: 100%;
            padding: 16px 20px;
            background: #0d0d0d;
            border: 1px solid #333;
            color: var(--white);
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            letter-spacing: 1px;
            transition: border-color 0.3s;
        }
        .subscribe-form input:focus {
            outline: none;
            border-color: var(--white);
        }
        .subscribe-form input::placeholder { color: #555; }

        .subscribe-btn {
            width: 100%;
            padding: 18px;
            background: transparent;
            color: var(--white);
            border: 1px solid #333;
            font-family: 'Inter', sans-serif;
            font-size: 12px;
            letter-spacing: 4px;
            text-transform: uppercase;
            cursor: pointer;
            transition: 0.3s;
        }
        .subscribe-btn:hover { border-color: var(--white); background: #151515; }
        .subscribe-btn:disabled { color: #666; cursor: not-allowed; }

        .form-message {
            padding: 16px;
            margin-top: 15px;
            text-align: center;
            letter-spacing: 2px;
            font-size: 12px;
            text-transform: uppercase;
            display: none;
        }
        .form-message.success {
            display: block;
            border: 1px solid #3a3;
            color: #8f8;
            background: #0a1a0a;
        }
        .form-message.error {
            display: block;
            border: 1px solid #a33;
            color: #f88;
            background: #0a0a0a;
        }

        .back-btn {
            display: inline-block;
            margin-top: 60px;
            padding: 14px 36px;
            border: 1px solid #333;
            color: var(--white);
            text-decoration: none;
            font-size: 11px;
            letter-spacing: 4px;
            text-transform: uppercase;
            transition: 0.3s;
        }
        .back-btn:hover { border-color: var(--white); background: #151515; }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(30px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 900px) {
            header { padding: 15px 20px; }
            .logo img { height: 32px; }
            .burger { display: flex; }
            nav {
                position: fixed;
                top: 0; right: -100%;
                width: 75%; max-width: 340px;
                height: 100vh;
                background: #0a0a0a;
                border-left: 1px solid #333;
                padding: 100px 40px 40px;
                transition: right 0.4s;
                z-index: 99;
            }
            nav.open { right: 0; }
            nav ul { flex-direction: column; gap: 28px; }
            nav a { font-size: 16px; letter-spacing: 4px; opacity: 1; }
            .soon-page { padding: 110px 20px 60px; }
            .soon-title { letter-spacing: 8px; }
        }
    </style>
</head>
<body>

<header>
    <a href="index.html" class="logo"><img src="logo.png" alt="ЗАДЕТ"></a>
    <button class="burger" id="burger" aria-label="Меню">
        <span></span><span></span><span></span>
    </button>
    <nav id="nav">
        <ul>
            <li><a href="shop.html" class="active">Магазин</a></li>
            <li><a href="index.html#collections">Коллекции</a></li>
            <li><a href="custom.html">Пошив</a></li>
            <li><a href="index.html#about">О бренде</a></li>
            <li><a href="index.html#contact">Контакты</a></li>
        </ul>
    </nav>
</header>

<section class="soon-page">
    <p class="soon-tag">Магазин в разработке</p>
    <h1 class="soon-title">Скоро</h1>
    <p class="soon-sub">
        Первая коллекция уже в работе.<br>
        Подпишись — сообщим первым, когда дроп будет готов
    </p>

    <div class="divider"></div>

    <div class="subscribe-block">
        <h2>Узнать первым</h2>
        <p>Выбери, как удобнее получать анонсы</p>

        <!-- Кнопка Telegram -->
        <a href="https://t.me/zadetclo_announce_bot" target="_blank" class="telegram-btn" id="telegram-btn">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M9.78 18.65l.28-4.23 7.68-6.92c.34-.31-.07-.46-.52-.19L7.74 13.3 3.64 12c-.88-.25-.89-.86.2-1.3l15.97-6.16c.73-.33 1.43.18 1.15 1.3l-2.72 12.81c-.19.91-.74 1.13-1.5.71L12.6 16.3l-1.99 1.93c-.23.23-.42.42-.83.42z"/>
            </svg>
            Подписаться в Telegram
        </a>

        <div class="or-divider">или</div>

        <!-- Форма Email -->
        <form class="subscribe-form" id="subscribe-form" action="https://formspree.io/f/xoeezkeq" method="POST">
            <input type="email" name="email" required placeholder="Email *">
            <input type="text" name="telegram" placeholder="Telegram (@username, необязательно)">
            <input type="hidden" name="form_type" value="Подписка на дроп">
            <button type="submit" class="subscribe-btn" id="subscribe-btn">Подписаться на email</button>
            <div class="form-message" id="form-message"></div>
        </form>
    </div>

    <a href="index.html" class="back-btn">← На главную</a>
</section>

<script src="telegram-config.js"></script>
<script>
    var burger = document.getElementById('burger');
    var nav = document.getElementById('nav');
    if (burger && nav) {
        burger.addEventListener('click', function() { nav.classList.toggle('open'); });
        var navLinks = nav.querySelectorAll('a');
        for (var i = 0; i < navLinks.length; i++) {
            navLinks[i].addEventListener('click', function() { nav.classList.remove('open'); });
        }
    }

    function sendToTelegram(text) {
        if (typeof TELEGRAM_BOT_TOKEN === 'undefined' || TELEGRAM_BOT_TOKEN.indexOf('ВСТАВЬ') !== -1) {
            return Promise.resolve();
        }
        var promises = [];
        for (var i = 0; i < TELEGRAM_CHAT_IDS.length; i++) {
            promises.push(
                fetch('https://api.telegram.org/bot' + TELEGRAM_BOT_TOKEN + '/sendMessage', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ chat_id: TELEGRAM_CHAT_IDS[i], text: text })
                }).catch(function() {})
            );
        }
        return Promise.all(promises);
    }

    var form = document.getElementById('subscribe-form');
    var submitBtn = document.getElementById('subscribe-btn');
    var formMessage = document.getElementById('form-message');

    form.addEventListener('submit', function(e) {
        e.preventDefault();
        submitBtn.disabled = true;
        submitBtn.textContent = 'Отправка...';
        formMessage.className = 'form-message';
        formMessage.textContent = '';

        var formData = new FormData(form);
        var email = formData.get('email');
        var telegram = formData.get('telegram');

        var tgText = '🔔 НОВАЯ EMAIL-ПОДПИСКА — ЗАДЕТ\n\n';
        tgText += '📧 Email: ' + (email || '—') + '\n';
        if (telegram) tgText += '💬 Telegram: ' + telegram;

        var mailPromise = fetch(form.action, {
            method: 'POST',
            body: formData,
            headers: { 'Accept': 'application/json' }
        });

        var tgPromise = sendToTelegram(tgText);

        Promise.all([mailPromise, tgPromise])
        .then(function(results) {
            if (results[0] && results[0].ok) {
                formMessage.textContent = '✓ Готово! Сообщим, когда откроемся 🖤';
                formMessage.className = 'form-message success';
                form.reset();
            } else {
                throw new Error('Ошибка');
            }
        })
        .catch(function() {
            formMessage.textContent = 'Что-то пошло не так. Попробуй ещё раз.';
            formMessage.className = 'form-message error';
        })
        .finally(function() {
            submitBtn.disabled = false;
            submitBtn.textContent = 'Подписаться на email';
        });
    });
</script>

</body>
</html>
